name: Bug report
description: Something misbehaved — a box, a command, a control
labels: ["bug", "status: triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Security-sensitive?** Do NOT file it here — use
        [private vulnerability reporting](../../security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, what you got. Paste exact error text.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduce
      description: The smallest sequence of commands that shows it.
      render: bash
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: corral version
      description: Output of `corral version`
      placeholder: corral 0.7.0 (3e4a28e, …) darwin/arm64
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: "15.5, Apple M2"
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: corral doctor
      description: Output of `corral doctor` (redact anything private). If one box misbehaves, add the relevant parts of `corral info` / `corral logs <box>`.
      render: text
