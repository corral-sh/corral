# SPIKE (#74), throwaway: can Corral run real boxes on a Linux host (Lima +
# QEMU/KVM) — and therefore its e2e in CI? Three jobs in parallel, each on its
# own runner: 9p bench, virtiofs bench, the full e2e. Not wired into ci.yml.
name: linux-spike

on:
  push:
    branches: [spike/linux-hosts]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: auto
  LIMA_VERSION: 2.3.0
  CORRAL_PLAIN: "1"

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        mode: [bench-9p, bench-virtiofs, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: host facts + KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm; nproc; free -h; uname -r
          # the runner image's toolchains we do not need: room for a golden image and two boxes
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: install qemu + Lima ${{ env.LIMA_VERSION }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf virtiofsd >/dev/null
          cd "$RUNNER_TEMP"
          base=https://github.com/lima-vm/lima/releases/download/v$LIMA_VERSION
          curl -fsSLO "$base/lima-$LIMA_VERSION-Linux-x86_64.tar.gz"
          curl -fsSLO "$base/SHA256SUMS"
          grep " lima-$LIMA_VERSION-Linux-x86_64.tar.gz\$" SHA256SUMS | sha256sum -c -
          sudo tar -C /usr/local -xzf "lima-$LIMA_VERSION-Linux-x86_64.tar.gz"
          limactl --version; qemu-system-x86_64 --version | head -1
          ls /usr/libexec/virtiofsd /usr/lib/qemu/virtiofsd 2>/dev/null || true

      - run: make build && bin/corral version
      - name: doctor (informational)
        run: bin/corral doctor || true

      - name: bench
        if: startsWith(matrix.mode, 'bench-')
        env:
          CORRAL_SPIKE_MOUNT: ${{ matrix.mode == 'bench-virtiofs' && 'virtiofs' || '9p' }}
        run: scripts/linux-spike-bench.sh

      - name: e2e
        if: matrix.mode == 'e2e'
        run: make e2e

      - name: guest logs on failure
        if: failure()
        run: |
          for d in /tmp/ch/lima/*/ /tmp/corral-e2e-*/lima/*/; do
            [ -d "$d" ] || continue
            echo "── $d"; tail -40 "$d"/ha.stderr.log 2>/dev/null; tail -40 "$d"/serial*.log 2>/dev/null
          done
