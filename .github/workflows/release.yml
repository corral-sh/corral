# Signed release on vX.Y.Z tags. Self-contained: re-runs every gate, then
# builds, signs SHA256SUMS with minisign (tools/sign; secret key only in the
# CORRAL_MINISIGN_KEY Actions secret) and publishes a GitHub release with
# changelog/X.Y.Z.md as the notes. A tag build without the key fails rather
# than releasing unsigned.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

env:
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: auto

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # --- the same gates ci.yml runs ---
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal tools | tee /dev/stderr)"
      - run: go vet ./...
      - run: go mod verify
      - run: go test ./... -count=1 -race
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
      - run: shellcheck -S warning install.sh scripts/*.sh internal/guest/scripts/*.sh
      - run: go install github.com/zricethezav/gitleaks/v8@latest
      - run: gitleaks git --no-banner --redact -v .

      # --- build, sign, publish ---
      - name: Build release binaries
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="$VERSION" COMMIT="$(git rev-parse --short HEAD)" make dist
      - name: Sign SHA256SUMS
        env:
          CORRAL_MINISIGN_KEY: ${{ secrets.CORRAL_MINISIGN_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go run ./tools/sign -sign -pub release/minisign.pub -comment "$VERSION SHA256SUMS" dist/SHA256SUMS
          go run ./tools/sign -verify -pub release/minisign.pub dist/SHA256SUMS
      - name: Build release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test -f "changelog/$VERSION.md" || { echo "missing changelog/$VERSION.md"; exit 1; }
          cat "changelog/$VERSION.md" > release-notes.md
          printf '\n## Install\n\n```\nbrew install corral-sh/tap/corral\n```\n\nIf Homebrew refuses to load the formula (tap trust), run `brew tap corral-sh/tap && brew trust corral-sh/tap` first.\n' >> release-notes.md
          printf '\n## Verify a downloaded binary\n\n```\nminisign -Vm SHA256SUMS -p minisign.pub && shasum -a 256 -c SHA256SUMS\n```\n\n`minisign.pub`:\n\n```\n' >> release-notes.md
          cat release/minisign.pub >> release-notes.md
          printf '```\n' >> release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Corral $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            dist/corral-darwin-arm64 dist/corral-darwin-amd64 dist/SHA256SUMS dist/SHA256SUMS.minisig
